    <!-- Google Fonts -->

    <!-- Tailwind CSS CDN -->

    <!-- React, ReactDOM, Babel, Lucide & Supabase -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        /* Kustom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // =========================================================================
        // DATA VERSI & INITIAL DATA (UBAH DATA INI LANGSUNG DI GITHUB KAPAN SAJA)
        // Naikkan DATA_VERSION (misal: "2.1", "2.2") jika ingin browser pengunjung
        // otomatis memperbarui tampilan publik sesuai kode baru di GitHub.
        // =========================================================================
        const DATA_VERSION = "3.0";

        const INITIAL_EVENTS = [
            {
                id: "ev-1",
                title: "Workshop Desain UI/UX & Design System Modern 2026",
                slug: "workshop-uiux-design-system-2026",
                category: "Desain & Kreatif",
                speaker: "Aditya Pratama, Lead Product Designer",
                institution: "Digital Innovation Lab",
                date: "2026-09-15",
                time: "09:00 - 15:30 WIB",
                location: "Online via Zoom & Figma Live",
                is_active: true,
                badge: "Terpopuler",
                description: "Pelajari cara membangun Design System yang scalable, komponen varian Figma terkini, serta implementasi tokens design untuk developer handoff yang efisien.",
                banner_url: "https://images.unsplash.com/photo-1581291518655-9523c932dede?auto=format&fit=crop&w=1200&q=80"
            },
            {
                id: "ev-2",
                title: "Masterclass Full-Stack Web: Modern React & Supabase",
                slug: "masterclass-fullstack-react-supabase",

                speaker: "Rian Hidayat, Senior Software Architect",
                institution: "Tech Academy Indonesia",
                date: "2026-09-20",

                location: "Hybrid (Auditorium Gedung Utama & Live Stream)",
                is_active: true,
                badge: "Sertifikasi",
                description: "Bedah tuntas integrasi React, arsitektur database modern, autentikasi aman, Realtime database, dan teknik deployment bebas hambatan.",
                banner_url: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1200&q=80"
            },
            {
                id: "ev-3",
                title: "Seminar Strategi AI & Automasi Produktivitas Kantor",
                slug: "seminar-ai-produktivitas-2026",
                category: "Teknologi & Bisnis",
                speaker: "Siti Nurhaliza, AI Transformation Consultant",
                institution: "FutureWork Consultant",
                date: "2026-09-28",
                time: "10:00 - 12:30 WIB",
                location: "Online Webinar",
                is_active: true,
                badge: "Gratis",
                description: "Optimalkan alur kerja bisnis harian dengan Generative AI, pembuatan prompt otomatis, dan integrasi workflow no-code terkini.",
                banner_url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80"
            }
        ];

        const INITIAL_MATERIALS = [
            // Materi Event 1 (UI/UX)
            {
                id: "mat-1",
                event_id: "ev-1",
                title: "Slide Presentasi Utama - Design System & UI/UX 2026",
                type: "pdf",
                speaker: "Aditya Pratama",
                description: "Slide komprehensif berisi teori, studi kasus industri, dan panduan langkah demi langkah.",
                file_url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
                file_size: "14.2 MB",
                is_active: true,
                is_locked: false,
                download_count: 142
            },
            {
                id: "mat-2",
                event_id: "ev-1",
                title: "File Template Figma Community & Token Kit",
                type: "link",
                speaker: "Aditya Pratama",
                description: "Link duplikasi file Figma yang memuat komponen UI, warna, dan tipografi siap pakai.",
                file_url: "https://www.figma.com/community",
                file_size: "Figma Link",
                is_active: true,
                is_locked: false,
                download_count: 310
            },
            {
                id: "mat-3",
                event_id: "ev-1",
                title: "Rekaman Video Sesi Live Workshop (Full HD)",
                type: "video",
                speaker: "Aditya Pratama",
                description: "Video rekaman berdurasi 4 jam lengkap dengan sesi tanya jawab interaktif.",
                file_url: "https://www.youtube.com",
                file_size: "Video Stream",
                is_active: true,
                is_locked: false,
                download_count: 89
            },

            // Materi Event 2 (React & Supabase)
            {
                id: "mat-4",
                event_id: "ev-2",
                title: "Handbook Modul Lengkap React & Supabase Architecture",
                type: "pdf",
                speaker: "Rian Hidayat",
                description: "Dokumentasi kode, cheatsheet hooks, dan skema tabel database.",
                file_url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
                file_size: "8.5 MB",
                is_active: true,
                is_locked: false,
                download_count: 220
            },
            {
                id: "mat-5",
                event_id: "ev-2",
                title: "Source Code Repository GitHub (Starter & Final Code)",
                type: "code",
                speaker: "Rian Hidayat",
                description: "Source code lengkap aplikasi CRUD modern berbasis React dan Supabase.",
                file_url: "https://github.com",
                file_size: "GitHub Repo",
                is_active: true,
                is_locked: false,
                download_count: 405
            },
            {
                id: "mat-6",
                event_id: "ev-2",
                title: "E-Certificate Peserta Resmi (Khusus Terdaftar)",
                type: "certificate",
                speaker: "Tech Academy Indonesia",
                description: "Sertifikat digital terverifikasi dengan nomor registrasi unik.",
                file_url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
                file_size: "PDF 1.2 MB",
                is_active: true,
                is_locked: false,
                download_count: 95
            },

            // Materi Event 3 (AI & Bisnis)
            {
                id: "mat-7",
                event_id: "ev-3",
                title: "Slide Presentasi AI Productivity & Prompting Framework",
                type: "presentation",
                speaker: "Siti Nurhaliza",
                description: "Kumpulan formula prompt teruji untuk marketing, analisis data, dan penulisan dokumen.",
                file_url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",
                file_size: "6.8 MB",
                is_active: true,
                is_locked: false,
                download_count: 178
            },
            {
                id: "mat-8",
                event_id: "ev-3",
                title: "Kumpulan Template Prompts & Workflow Otomasi (Google Sheets)",
                type: "sheet",
                speaker: "Siti Nurhaliza",
                description: "Katalog prompt AI siap copy-paste langsung ke ChatGPT / Gemini / Claude.",
                file_url: "https://docs.google.com",
                file_size: "Spreadsheet",
                is_active: true,
                is_locked: false,
                download_count: 260
            }
        ];

        // Format Ikon Berdasarkan Tipe File
        const getTypeInfo = (type) => {
            switch(type) {
                case 'pdf':
                    return { icon: 'file-text', color: 'text-rose-400', bg: 'bg-rose-500/10 border-rose-500/20', label: 'PDF Document' };
                case 'presentation':
                case 'ppt':
                    return { icon: 'presentation', color: 'text-amber-400', bg: 'bg-amber-500/10 border-amber-500/20', label: 'Slide PPT' };
                case 'video':
                    return { icon: 'video', color: 'text-sky-400', bg: 'bg-sky-500/10 border-sky-500/20', label: 'Video Sesi' };
                case 'code':
                    return { icon: 'code', color: 'text-emerald-400', bg: 'bg-emerald-500/10 border-emerald-500/20', label: 'Source Code' };
                case 'sheet':
                    return { icon: 'table', color: 'text-teal-400', bg: 'bg-teal-500/10 border-teal-500/20', label: 'Spreadsheet' };
                case 'certificate':
                    return { icon: 'award', color: 'text-purple-400', bg: 'bg-purple-500/10 border-purple-500/20', label: 'E-Sertifikat' };
                default:
                    return { icon: 'link-2', color: 'text-indigo-400', bg: 'bg-indigo-500/10 border-indigo-500/20', label: 'Resource Link' };
            }
        };

        // ==========================================
        // KOMPONEN UTAMA APLIKASI
        // ==========================================
        function App() {
            // State Navigasi
            const [currentView, setCurrentView] = useState('home'); // 'home' | 'event-detail' | 'admin'
            const [selectedEventId, setSelectedEventId] = useState(null);

            // State Data
            const [events, setEvents] = useState([]);
            const [materials, setMaterials] = useState([]);

            // State Pencarian & Filter
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [selectedType, setSelectedType] = useState('Semua');

            // State Admin & Modal
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = useState('');
            const [adminError, setAdminError] = useState('');

            // Modal CRUD Event & Material
            const [showEventModal, setShowEventModal] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            const [eventFormData, setEventFormData] = useState({
                title: '',
                category: 'Umum',
                speaker: '',
                institution: '',
                date: '',
                time: '',
                location: '',
                description: '',
                banner_url: '',
                badge: '',
                is_active: true
            });

            const [showMaterialModal, setShowMaterialModal] = useState(false);
            const [editingMaterial, setEditingMaterial] = useState(null);
            const [materialFormData, setMaterialFormData] = useState({
                event_id: '',
                title: '',
                type: 'pdf',
                speaker: '',
                description: '',
                file_url: '',
                file_size: '',
                is_active: true,
                is_locked: false
            });

            // Toast Alert
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Inisialisasi Data & Auto-Sync dengan Versi Kode GitHub
            useEffect(() => {
                const savedVersion = localStorage.getItem('portal_materi_version');
                const savedEvents = localStorage.getItem('portal_materi_events');
                const savedMaterials = localStorage.getItem('portal_materi_materials');

                // Jika versi di kode berbeda atau data kosong, gunakan data langsung dari kode GitHub
                if (savedVersion !== DATA_VERSION || !savedEvents || !savedMaterials) {
                    setEvents(INITIAL_EVENTS);
                    setMaterials(INITIAL_MATERIALS);
                    localStorage.setItem('portal_materi_version', DATA_VERSION);
                    localStorage.setItem('portal_materi_events', JSON.stringify(INITIAL_EVENTS));
                    localStorage.setItem('portal_materi_materials', JSON.stringify(INITIAL_MATERIALS));
                } else {
                    try {
                        setEvents(JSON.parse(savedEvents));
                        setMaterials(JSON.parse(savedMaterials));
                    } catch (e) {
                        setEvents(INITIAL_EVENTS);
                        setMaterials(INITIAL_MATERIALS);
                    }
                }
            }, []);

            // Render Ikon Lucide secara reaktif setiap kali view/state berubah
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Sinkronisasi data ke LocalStorage saat admin mengubah data
            const saveEventsToStorage = (newEvents) => {
                setEvents(newEvents);
                localStorage.setItem('portal_materi_events', JSON.stringify(newEvents));
            };

            const saveMaterialsToStorage = (newMaterials) => {
                setMaterials(newMaterials);
                localStorage.setItem('portal_materi_materials', JSON.stringify(newMaterials));
            };

            // Reset manual ke data GitHub
            const handleResetToGitHub = () => {
                if (confirm('Kembalikan semua event dan materi ke versi asli yang ada di kode GitHub?')) {
                    setEvents(INITIAL_EVENTS);
                    setMaterials(INITIAL_MATERIALS);
                    localStorage.setItem('portal_materi_version', DATA_VERSION);
                    localStorage.setItem('portal_materi_events', JSON.stringify(INITIAL_EVENTS));
                    localStorage.setItem('portal_materi_materials', JSON.stringify(INITIAL_MATERIALS));
                    showToast('Data berhasil disinkronkan dengan kode GitHub!', 'success');
                }
            };

            // Ambil Event yang Sedang Dipilih
            const selectedEvent = useMemo(() => {
                return events.find(ev => ev.id === selectedEventId) || null;
            }, [events, selectedEventId]);

            // Kategori Unik untuk Filter
            const categories = useMemo(() => {
                const cats = new Set(events.map(e => e.category).filter(Boolean));
                return ['Semua', ...Array.from(cats)];
            }, [events]);

            // Filter Event untuk Tampilan Publik
            const filteredEvents = useMemo(() => {
                return events.filter(event => {
                    // Hanya tampilkan event aktif untuk publik (kecuali admin)
                    if (!isAdmin && !event.is_active) return false;

                    const matchSearch = (
                        event.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        event.speaker.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (event.description && event.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        (event.institution && event.institution.toLowerCase().includes(searchQuery.toLowerCase()))
                    );

                    const matchCategory = selectedCategory === 'Semua' || event.category === selectedCategory;

                    return matchSearch && matchCategory;
                });
            }, [events, searchQuery, selectedCategory, isAdmin]);

            // Filter Materi untuk Event Detail
            const eventMaterials = useMemo(() => {
                if (!selectedEventId) return [];
                return materials.filter(mat => {
                    if (mat.event_id !== selectedEventId) return false;
                    if (!isAdmin && !mat.is_active) return false;
                    if (selectedType !== 'Semua' && mat.type !== selectedType) return false;
                    return true;
                });
            }, [materials, selectedEventId, isAdmin, selectedType]);

            // Navigasi ke Detail Event
            const handleOpenEvent = (eventId) => {
                setSelectedEventId(eventId);
                setSelectedType('Semua');
                setCurrentView('event-detail');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Handler Salin Tautan (Aman untuk iframe / browser permissions)
            const handleCopyLink = (url, title) => {
                try {
                    const tempInput = document.createElement('textarea');
                    tempInput.value = url;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                    showToast(`Tautan "${title}" berhasil disalin!`);
                } catch (err) {
                    showToast('Gagal menyalin tautan otomatis.', 'error');
                }
            };

            // Login Admin Sederhana (Password default: 'admin123')
            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPasswordInput === 'admin123' || adminPasswordInput === 'admin') {
                    setIsAdmin(true);
                    setShowAdminLoginModal(false);
                    setAdminPasswordInput('');
                    setAdminError('');
                    showToast('Selamat datang, Admin! Mode pengelola aktif.');
                } else {
                    setAdminError('Password salah! Coba gunakan: admin123');
                }
            };

            // Form Submit Event (Create / Edit)
            const handleSaveEvent = (e) => {
                e.preventDefault();
                if (!eventFormData.title) {
                    showToast('Judul event wajib diisi', 'error');
                    return;
                }

                if (editingEvent) {
                    const updated = events.map(ev => ev.id === editingEvent.id ? { ...eventFormData, id: editingEvent.id } : ev);
                    saveEventsToStorage(updated);
                    showToast('Event berhasil diperbarui!');
                } else {
                    const newEv = {
                        ...eventFormData,
                        id: 'ev-' + Date.now(),
                        slug: eventFormData.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')
                    };
                    saveEventsToStorage([newEv, ...events]);
                    showToast('Event baru berhasil ditambahkan!');
                }
                setShowEventModal(false);
                setEditingEvent(null);
            };

            // Form Submit Material (Create / Edit)
            const handleSaveMaterial = (e) => {
                e.preventDefault();
                if (!materialFormData.title || !materialFormData.file_url) {
                    showToast('Judul dan URL file materi wajib diisi', 'error');
                    return;
                }

                if (editingMaterial) {
                    const updated = materials.map(m => m.id === editingMaterial.id ? { ...materialFormData, id: editingMaterial.id } : m);
                    saveMaterialsToStorage(updated);
                    showToast('Materi berhasil diperbarui!');
                } else {
                    const newMat = {
                        ...materialFormData,
                        id: 'mat-' + Date.now(),
                        download_count: 0
                    };
                    saveMaterialsToStorage([...materials, newMat]);
                    showToast('Materi baru berhasil ditambahkan!');
                }
                setShowMaterialModal(false);
                setEditingMaterial(null);
            };

            // Hapus Event
            const handleDeleteEvent = (eventId) => {
                if (confirm('Apakah Anda yakin ingin menghapus event ini beserta seluruh materinya?')) {
                    const updatedEvents = events.filter(e => e.id !== eventId);
                    const updatedMaterials = materials.filter(m => m.event_id !== eventId);
                    saveEventsToStorage(updatedEvents);
                    saveMaterialsToStorage(updatedMaterials);
                    if (selectedEventId === eventId) {
                        setCurrentView('home');
                    }
                    showToast('Event dan materi terkait berhasil dihapus');
                }
            };

            // Hapus Materi
            const handleDeleteMaterial = (materialId) => {
                if (confirm('Hapus materi ini?')) {
                    const updated = materials.filter(m => m.id !== materialId);
                    saveMaterialsToStorage(updated);
                    showToast('Materi berhasil dihapus');
                }
            };

            // Download Counter Tracker
            const handleDownloadClick = (material) => {
                const updated = materials.map(m => {
                    if (m.id === material.id) {
                        return { ...m, download_count: (m.download_count || 0) + 1 };
                    }
                    return m;
                });
                saveMaterialsToStorage(updated);
            };

            return (
                <div className="min-h-screen flex flex-col bg-[#0b0f19] text-slate-100">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 flex items-center space-x-3 bg-slate-800/95 border border-slate-700 text-white px-5 py-3.5 rounded-2xl shadow-2xl backdrop-blur-md animate-bounce">
                            <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className={toast.type === 'error' ? 'w-5 h-5 text-rose-400' : 'w-5 h-5 text-emerald-400'}></i>
                            <span className="text-sm font-medium">{toast.message}</span>
                        </div>
                    )}

                    {/* Navbar */}
                    <header className="sticky top-0 z-40 bg-[#0b0f19]/80 backdrop-blur-xl border-b border-slate-800/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            {/* Brand Logo */}
                            <div 
                                onClick={() => { setCurrentView('home'); setSelectedEventId(null); }}
                                className="flex items-center space-x-3 cursor-pointer group"
                            >
                                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 p-[2px] shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition duration-300">
                                    <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                                        <i data-lucide="layers" className="w-5 h-5 text-indigo-400"></i>
                                    </div>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <span className="font-extrabold text-lg tracking-tight text-white group-hover:text-indigo-400 transition">
                                            Portal Materi
                                        </span>
                                        <span className="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                                            Workshop
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400 font-medium hidden sm:block">Akses Modul, Slide & Rekaman Resmi</p>
                                </div>
                            </div>

                            {/* Nav Actions */}
                            <div className="flex items-center space-x-3">
                                {currentView !== 'home' && (
                                    <button 
                                        onClick={() => { setCurrentView('home'); setSelectedEventId(null); }}
                                        className="hidden sm:flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition border border-transparent hover:border-slate-700"
                                    >
                                        <i data-lucide="arrow-left" className="w-4 h-4"></i>
                                        <span>Daftar Event</span>
                                    </button>
                                )}

                                {isAdmin ? (
                                    <div className="flex items-center space-x-2 bg-indigo-950/40 border border-indigo-500/30 px-3 py-1.5 rounded-2xl">
                                        <span className="flex h-2 w-2 relative">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </span>
                                        <span className="text-xs font-bold text-indigo-300 hidden md:inline">Mode Admin</span>
                                        <button 
                                            onClick={handleResetToGitHub}
                                            title="Sinkronkan dengan kode GitHub terbaru"
                                            className="px-2.5 py-1 text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition"
                                        >
                                            Sync GitHub
                                        </button>
                                        <button 
                                            onClick={() => { setIsAdmin(false); showToast('Keluar dari mode admin'); }}
                                            className="p-1 text-slate-400 hover:text-rose-400 transition"
                                            title="Keluar Admin"
                                        >
                                            <i data-lucide="log-out" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button

                                                                onClick={() => handleCopyLink(mat.file_url, mat.title)}
                                                                className="p-2 text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-800 rounded-xl transition"
                                                                title="Salin Tautan Materi"
                                                            >
                                                                <i data-lucide="copy" className="w-4 h-4"></i>
                                                            </button>

                                                            <a
                                                                href={mat.file_url}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                onClick={() => handleDownloadClick(mat)}
                                                                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold flex items-center space-x-1.5 transition shadow-md shadow-indigo-600/20"
                                                            >
                                                                <span>Unduh / Buka</span>
                                                                <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                                            </a>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-950 border-t border-slate-800/80 py-8 text-center text-xs text-slate-400 mt-16">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center space-x-2">
                                <i data-lucide="layers" className="w-4 h-4 text-indigo-400"></i>
                                <span className="font-bold text-slate-300">Portal Materi Workshop</span>
                                <span>&copy; 2026. Hak Cipta Dilindungi.</span>
                            </div>
                            <div className="flex items-center space-x-4 text-slate-400 text-xs">
                                <span>Status: Publik Aktif</span>
                                <span>•</span>
                                <span>Data Versi {DATA_VERSION}</span>
                            </div>
                        </div>
                    </footer>

                    {/* ======================================================= */}
                    {/* MODAL ADMIN LOGIN */}
                    {/* ======================================================= */}
                    {showAdminLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl relative">
                                <div className="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mx-auto mb-4">
                                    <i data-lucide="shield-check" className="w-6 h-6"></i>
                                </div>
                                <h3 className="text-lg font-bold text-white text-center mb-1">Akses Pengelola Data</h3>
                                <p className="text-xs text-slate-400 text-center mb-6">
                                    Masukkan password admin untuk menambah, mengedit, atau menghapus materi workshop.
                                </p>

                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 mb-2">Password Pengelola</label>
                                        <input 
                                            type="password"
                                            value={adminPasswordInput}
                                            onChange={(e) => { setAdminPasswordInput(e.target.value); setAdminError(''); }}
                                            placeholder="Masukkan password..."
                                            className="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            autoFocus
                                        />
                                        {adminError && <p className="text-xs text-rose-400 mt-1.5">{adminError}</p>}
                                        <p className="text-[11px] text-slate-400 mt-1.5">Default password: <code className="text-indigo-300">admin123</code></p>
                                    </div>

                                    <div className="pt-2 flex items-center justify-end space-x-3">
                                        <button 
                                            type="button" 
                                            onClick={() => { setShowAdminLoginModal(false); setAdminError(''); }}
                                            className="px-4 py-2.5 text-xs font-bold text-slate-400 hover:text-white rounded-xl transition"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-indigo-600/30"
                                        >
                                            Masuk Admin
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ======================================================= */}
                    {/* MODAL TAMBAH / EDIT EVENT */}
                    {/* ======================================================= */}
                    {showEventModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-xl w-full shadow-2xl my-8">
                                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                                    <h3 className="text-lg font-bold text-white">
                                        {editingEvent ? 'Edit Data Event' : 'Tambah Event Workshop Baru'}
                                    </h3>
                                    <button onClick={() => setShowEventModal(false)} className="text-slate-400 hover:text-white">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveEvent} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1.5">Judul Workshop / Seminar *</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={eventFormData.title}
                                            onChange={(e) => setEventFormData({ ...eventFormData, title: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="Contoh: Workshop Fullstack Web Modern 2026"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Kategori *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={eventFormData.category}
                                                onChange={(e) => setEventFormData({ ...eventFormData, category: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="Desain, Pemrograman, Bisnis..."
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Label Badge (Opsional)</label>
                                            <input 
                                                type="text" 
                                                value={eventFormData.badge}
                                                onChange={(e) => setEventFormData({ ...eventFormData, badge: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="Terpopuler, Gratis, Sertifikat..."
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Nama Pemateri *</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={eventFormData.speaker}
                                                onChange={(e) => setEventFormData({ ...eventFormData, speaker: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="Nama lengkap pemateri"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Instansi / Penyelenggara</label>
                                            <input 
                                                type="text" 
                                                value={eventFormData.institution}
                                                onChange={(e) => setEventFormData({ ...eventFormData, institution: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="Tech Academy, dsb."
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Tanggal</label>
                                            <input 
                                                type="date" 
                                                value={eventFormData.date}
                                                onChange={(e) => setEventFormData({ ...eventFormData, date: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Waktu</label>
                                            <input 
                                                type="text" 
                                                value={eventFormData.time}
                                                onChange={(e) => setEventFormData({ ...eventFormData, time: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="09:00 - 15:00 WIB"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Lokasi / Media</label>
                                            <input 
                                                type="text" 
                                                value={eventFormData.location}
                                                onChange={(e) => setEventFormData({ ...eventFormData, location: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="Zoom / Offline"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1.5">URL Gambar Poster / Banner</label>
                                        <input 
                                            type="url" 
                                            value={eventFormData.banner_url}
                                            onChange={(e) => setEventFormData({ ...eventFormData, banner_url: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="https://images.unsplash.com/..."
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1.5">Deskripsi Lengkap Workshop</label>
                                        <textarea 
                                            rows="3"
                                            value={eventFormData.description}
                                            onChange={(e) => setEventFormData({ ...eventFormData, description: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="Jelaskan topik yang dipelajari peserta..."
                                        ></textarea>
                                    </div>

                                    <div className="flex items-center space-x-2 pt-2">
                                        <input 
                                            type="checkbox" 
                                            id="eventActiveCheck"
                                            checked={eventFormData.is_active}
                                            onChange={(e) => setEventFormData({ ...eventFormData, is_active: e.target.checked })}
                                            className="w-4 h-4 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500"
                                        />
                                        <label htmlFor="eventActiveCheck" className="text-slate-300 font-medium cursor-pointer">
                                            Publikasikan Event (Dapat Dilihat Publik)
                                        </label>
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-3 border-t border-slate-800">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowEventModal(false)}
                                            className="px-4 py-2.5 text-slate-400 hover:text-white rounded-xl font-bold transition"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition shadow-lg shadow-indigo-600/30"
                                        >
                                            {editingEvent ? 'Simpan Perubahan' : 'Terbitkan Event'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ======================================================= */}
                    {/* MODAL TAMBAH / EDIT MATERI */}
                    {/* ======================================================= */}
                    {showMaterialModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl my-8">
                                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                                    <h3 className="text-lg font-bold text-white">
                                        {editingMaterial ? 'Edit Berkas Materi' : 'Tambah Materi Baru'}
                                    </h3>
                                    <button onClick={() => setShowMaterialModal(false)} className="text-slate-400 hover:text-white">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveMaterial} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1.5">Judul Materi *</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={materialFormData.title}
                                            onChange={(e) => setMaterialFormData({ ...materialFormData, title: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="Contoh: Modul PDF Sesi 1 - Fundamental"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Tipe / Format Materi *</label>
                                            <select 
                                                value={materialFormData.type}
                                                onChange={(e) => setMaterialFormData({ ...materialFormData, type: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            >
                                                <option value="pdf">Dokumen PDF</option>
                                                <option value="presentation">Slide Presentasi (PPT)</option>
                                                <option value="video">Rekaman Video</option>
                                                <option value="code">Source Code / Repo</option>
                                                <option value="sheet">Spreadsheet (Excel/Sheets)</option>
                                                <option value="certificate">E-Sertifikat</option>
                                                <option value="link">Tautan Luar / Resource</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1.5">Ukuran File / Keterangan</label>
                                            <input 
                                                type="text" 
                                                value={materialFormData.file_size}
                                                onChange={(e) => setMaterialFormData({ ...materialFormData, file_size: e.target.value })}
                                                className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="Contoh: 12.5 MB / Video Link"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1.5">URL File / Unduhan / Link *</label>
                                        <input 
                                            type="url" 
                                            required
                                            value={materialFormData.file_url}
                                            onChange={(e) => setMaterialFormData({ ...materialFormData, file_url: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="https://drive.google.com/... atau https://..."
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1.5">Deskripsi Singkat Materi</label>
                                        <textarea 
                                            rows="2"
                                            value={materialFormData.description}
                                            onChange={(e) => setMaterialFormData({ ...materialFormData, description: e.target.value })}
                                            className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="Penjelasan ringkas mengenai isi file ini..."
                                        ></textarea>
                                    </div>

                                    <div className="flex items-center space-x-2 pt-2">
                                        <input 
                                            type="checkbox" 
                                            id="matActiveCheck"
                                            checked={materialFormData.is_active}
                                            onChange={(e) => setMaterialFormData({ ...materialFormData, is_active: e.target.checked })}
                                            className="w-4 h-4 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500"
                                        />
                                        <label htmlFor="matActiveCheck" className="text-slate-300 font-medium cursor-pointer">
                                            Materi Aktif (Dapat Dilihat & Diunduh Peserta)
                                        </label>
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-3 border-t border-slate-800">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowMaterialModal(false)}
                                            className="px-4 py-2.5 text-slate-400 hover:text-white rounded-xl font-bold transition"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition shadow-lg shadow-indigo-600/30"
                                        >
                                            Simpan Materi
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render Aplikasi ke DOM
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
