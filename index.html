        const GOOGLE_APPS_SCRIPT_CODE = `// ==========================================
// CODE.GS - GOOGLE APPS SCRIPT SYNC (Spreadsheet Link Below)
// Sheet URL: https://docs.google.com/spreadsheets/d/1kzfZJnrB2aVfjTypg0uf3jupw0xbMibvWG6zaCOj30k/edit
// ==========================================

function doGet(e) {
  return ContentService.createTextOutput(JSON.stringify({ 
    "status": "success", 
    "message": "API Portal Materi Workshop aktif dan siap menerima data pendaftaran & unduhan." 
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    var timestamp = new Date();
    
    if (data.type === 'REGISTRATION') {
      sheet.appendRow([
        timestamp,
        'PENDAFTARAN',
        data.full_name,
        data.email,
        data.institution,
        data.whatsapp || '-',
        '-'
      ]);
    } else if (data.type === 'DOWNLOAD') {
      sheet.appendRow([
        timestamp,
        'DOWNLOAD MATERI',
        data.user_name,
        data.user_email,
        data.institution || '-',
        '-',
        data.material_title
      ]);
    }
    
    return ContentService.createTextOutput(JSON.stringify({ "status": "success" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ "status": "error", "message": err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

        const Icon = ({ name, className = "w-5 h-5" }) => {

                file_url: '#download-zip-4',

            {

        const Toast = ({ message, type, onClose }) => {
            if (!message) return null;
            const isSuccess = type === 'success';
            return (
                <div className={`fixed bottom-6 right-6 z-50 flex items-center p-4 rounded-2xl shadow-2xl border transition-all duration-300 backdrop-blur-md ${
                    isSuccess ? 'bg-emerald-950/90 text-emerald-200 border-emerald-500/50' : 'bg-rose-950/90 text-rose-200 border-rose-500/50'
                }`}>
                    <div className="mr-3">
                        <Icon name={isSuccess ? "check-circle" : "alert-circle"} className={`w-5 h-5 ${isSuccess ? 'text-emerald-400' : 'text-rose-400'}`} />

        function App() {
            const [materials, setMaterials] = useState(() => {
                const saved = localStorage.getItem('pmw_materials');
                return saved ? JSON.parse(saved) : INITIAL_MATERIALS;
            });

            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('pmw_users');
                return saved ? JSON.parse(saved) : INITIAL_USERS;
            });

            const [downloads, setDownloads] = useState(() => {
                const saved = localStorage.getItem('pmw_downloads');
                return saved ? JSON.parse(saved) : INITIAL_DOWNLOADS;
            });

            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('pmw_current_user');
                return saved ? JSON.parse(saved) : null;
            });

            const [activeTab, setActiveTab] = useState('landing');
            const [authModal, setAuthModal] = useState({ open: false, mode: 'login' });
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [showCodeGsModal, setShowCodeGsModal] = useState(false);
            
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [sortBy, setSortBy] = useState('terbaru');

            const [toast, setToast] = useState({ message: '', type: 'success' });

            useEffect(() => {
                localStorage.setItem('pmw_materials', JSON.stringify(materials));
            }, [materials]);

            useEffect(() => {
                localStorage.setItem('pmw_users', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem('pmw_downloads', JSON.stringify(downloads));
            }, [downloads]);

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('pmw_current_user', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('pmw_current_user');
                }
            }, [currentUser]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => {
                    setToast({ message: '', type: 'success' });
                }, 4000);
            };

            const sendDataToGoogleSheet = async (payload) => {
                try {
                    await fetch(GOOGLE_SCRIPT_WEBAPP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (err) {
                    console.warn('Sync ke Google Sheet terhambat:', err);
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setActiveTab('landing');
                showToast('Berhasil keluar dari akun.', 'success');
            };

            const categories = useMemo(() => {
                const set = new Set(materials.map(m => m.category));
                return ['Semua', ...Array.from(set)];
            }, [materials]);

            const filteredMaterials = useMemo(() => {
                return materials.filter(m => {
                    const matchSearch = m.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                        m.presenter.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                        m.description.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchCategory = selectedCategory === 'Semua' || m.category === selectedCategory;
                    const matchActive = currentUser && currentUser.role === 'admin' ? true : m.is_active;
                    return matchSearch && matchCategory && matchActive;
                }).sort((a, b) => {
                    if (sortBy === 'terbaru') return new Date(b.created_at) - new Date(a.created_at);
                    if (sortBy === 'terlama') return new Date(a.created_at) - new Date(b.created_at);
                    if (sortBy === 'title') return a.title.localeCompare(b.title);
                    return 0;
                });
            }, [materials, searchTerm, selectedCategory, sortBy, currentUser]);

            const handleDownload = (material) => {
                if (!currentUser) {
                    setAuthModal({ open: true, mode: 'login' });
                    showToast('Silakan masuk terlebih dahulu untuk mengunduh berkas.', 'error');
                    return;
                }

                const newDownload = {
                    id: 'dl-' + Date.now(),
                    user_id: currentUser.id,
                    user_name: currentUser.full_name,
                    user_email: currentUser.email,
                    institution: currentUser.institution,
                    material_id: material.id,
                    material_title: material.title,
                    file_name: material.file_name,
                    downloaded_at: new Date().toLocaleString('id-ID')
                };

                setDownloads(prev => [newDownload, ...prev]);

                sendDataToGoogleSheet({
                    type: 'DOWNLOAD',
                    user_name: currentUser.full_name,
                    user_email: currentUser.email,
                    institution: currentUser.institution,
                    material_title: material.title
                });

                if (material.file_url && (material.file_url.startsWith('http://') || material.file_url.startsWith('https://'))) {
                    window.open(material.file_url, '_blank');
                } else {
                    const dummyContent = `Portal Materi Workshop\n=======================\nJudul: ${material.title}\nPemateri: ${material.presenter}\nDiunduh Oleh: ${currentUser.full_name} (${currentUser.email})\nInstansi: ${currentUser.institution}\nTanggal: ${new Date().toLocaleString('id-ID')}\n\nTerima kasih telah berpartisipasi dalam workshop ini!`;
                    const blob = new Blob([dummyContent], { type: 'text/plain' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = material.file_name || `${material.title.replace(/ /g, '_')}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                }

                showToast(`Materi "${material.title}" berhasil diunduh! Data tersinkron ke Google Sheet.`, 'success');
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">

                                    </div>

                                    </div>
                                </div>

                                <nav className="hidden md:flex items-center space-x-1 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800/80">
                                    <button 
                                        onClick={() => setActiveTab('landing')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'landing' ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        Beranda
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('materi')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeTab === 'materi' ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        Materi Workshop
                                    </button>
                                    {currentUser && (
                                        <button 
                                            onClick={() => setActiveTab(currentUser.role === 'admin' ? 'admin' : 'dashboard')}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${['dashboard', 'admin', 'riwayat', 'profil'].includes(activeTab) ? 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-white'}`}
                                        >
                                            {currentUser.role === 'admin' ? 'Admin Panel' : 'Dashboard Saya'}
                                        </button>
                                    )}
                                </nav>

                                <div className="flex items-center space-x-3">
                                    <button 
                                        onClick={() => setShowCodeGsModal(true)}
                                        className="hidden sm:inline-flex items-center space-x-2 text-xs px-4 py-2 rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 font-semibold hover:bg-emerald-500/20 transition"
                                        title="Script Google Apps Script Sync"
                                    >
                                        <Icon name="sheet" className="w-4 h-4 text-emerald-400" />
                                        <span>Google Sheet Sync</span>
                                    </button>

                                    {currentUser ? (
                                        <div className="flex items-center space-x-3 pl-3 border-l border-slate-800">
                                            <div className="text-right hidden sm:block">
                                                <div className="text-sm font-bold text-white">{currentUser.full_name}</div>
                                                <div className="text-[11px] font-semibold text-cyan-400 capitalize">{currentUser.role === 'admin' ? 'Pemateri / Admin' : currentUser.institution}</div>
                                            </div>
                                            <button 
                                                onClick={handleLogout}
                                                className="p-2.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition"
                                                title="Logout"
                                            >
                                                <Icon name="log-out" className="w-5 h-5" />
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="flex items-center space-x-2">
                                            <button 
                                                onClick={() => setAuthModal({ open: true, mode: 'login' })}

                                            >

                                                onClick={() => setAuthModal({ open: true, mode: 'register' })}
                                                className="px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-violet-600 via-indigo-600 to-cyan-500 hover:opacity-95 rounded-xl shadow-lg shadow-indigo-600/30 transition"
                                            >
                                                Daftar Sekarang
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </header>

                        <main>
                            {activeTab === 'landing' && (
                                <div>

                                            <span className="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold bg-violet-500/10 text-violet-300 border border-violet-500/30 mb-8 backdrop-blur-md">
                                                <Icon name="sparkles" className="w-4 h-4 text-cyan-400" /> Platform Berbagi Materi Terpercaya
                                            </span>

                                                        >
                                                            <span>Daftar Sekarang</span>
                                                            <Icon name="user-plus" className="w-5 h-5" />
                                                        </button>
                                                        <button 
                                                            onClick={() => setAuthModal({ open: true, mode: 'login' })}

                                                        >
                                                            Masuk Ke Akun
                                                        </button>
                                                    </>

                                            </div>

                                            <div className="mt-20 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto">
                                                <div className="p-6 rounded-2xl glass-card flex items-center space-x-4 text-left">
                                                    <div className="p-3.5 rounded-xl bg-violet-500/10 text-violet-400 border border-violet-500/20">

                        </div>
                        <div className="glass-card p-6 rounded-2xl flex items-center space-x-4">
                            <div className="p-4 bg-emerald-500/20 text-emerald-400 rounded-xl border border-emerald-500/30">
                                <Icon name="users" className="w-6 h-6" />
                            </div>
                            <div>
                                <div className="text-xs text-slate-400 font-bold uppercase">Total Peserta</div>
                                <div className="text-2xl font-black text-white">{users.length}</div>
                            </div>
                        </div>
                        <div className="glass-card p-6 rounded-2xl flex items-center space-x-4">
                            <div className="p-4 bg-cyan-500/20 text-cyan-400 rounded-xl border border-cyan-500/30">
                                <Icon name="download" className="w-6 h-6" />
                            </div>
                            <div>
                                <div className="text-xs text-slate-400 font-bold uppercase">Total Unduhan</div>
                                <div className="text-2xl font-black text-white">{downloads.length}</div>
                            </div>
                        </div>
                    </div>

                    <div className="flex border-b border-slate-800 mb-6 space-x-6">
                        <button 
                            onClick={() => setAdminSubTab('materials')}
                            className={`pb-3 text-sm font-bold border-b-2 ${adminSubTab === 'materials' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}`}
                        >
                            Kelola Materi ({materials.length})
                        </button>
                        <button 
                            onClick={() => setAdminSubTab('users')}
                            className={`pb-3 text-sm font-bold border-b-2 ${adminSubTab === 'users' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}`}
                        >
                            Kelola Peserta ({users.length})
                        </button>
                        <button 
                            onClick={() => setAdminSubTab('downloads')}
                            className={`pb-3 text-sm font-bold border-b-2 ${adminSubTab === 'downloads' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}`}
                        >
                            Log Unduhan ({downloads.length})
                        </button>
                        <button 
                            onClick={() => setAdminSubTab('rls')}
                            className={`pb-3 text-sm font-bold border-b-2 ${adminSubTab === 'rls' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}`}
                        >
                            Supabase RLS Schema
                        </button>
                    </div>

                    {adminSubTab === 'materials' && (
                        <div>
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-lg font-bold text-white">Daftar Materi Workshop</h3>
                                <button onClick={openAddModal} className="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-500 transition flex items-center space-x-2 shadow-lg shadow-indigo-600/30">
                                    <Icon name="plus" className="w-4 h-4" />
                                    <span>Tambah Materi Baru</span>
                                </button>
                            </div>

                            <div className="glass-card rounded-3xl overflow-hidden">
                                <table className="w-full text-left text-sm text-slate-300">
                                    <thead className="bg-slate-900/80 border-b border-slate-800 text-xs text-slate-400 uppercase font-bold">
                                        <tr>
                                            <th className="px-6 py-4">Materi & Kategori</th>
                                            <th className="px-6 py-4">Pemateri</th>
                                            <th className="px-6 py-4">Format File</th>
                                            <th className="px-6 py-4">Status</th>
                                            <th className="px-6 py-4 text-right">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {materials.map(mat => (
                                            <tr key={mat.id} className="hover:bg-slate-800/40 transition">
                                                <td className="px-6 py-4">
                                                    <div className="font-bold text-white">{mat.title}</div>
                                                    <span className="inline-block mt-1 text-[11px] font-bold text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">
                                                        {mat.category}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 text-slate-300 font-medium">{mat.presenter}</td>
                                                <td className="px-6 py-4 font-mono text-xs text-slate-400">{mat.file_type} ({mat.file_size})</td>
                                                <td className="px-6 py-4">
                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${mat.is_active ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}`}>
                                                        {mat.is_active ? 'Aktif' : 'Nonaktif'}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 text-right space-x-2">
                                                    <button onClick={() => openEditModal(mat)} className="p-2 text-slate-400 hover:text-cyan-400 hover:bg-slate-800 rounded-lg transition" title="Edit">
                                                        <Icon name="edit-3" className="w-4 h-4" />
                                                    </button>
                                                    <button onClick={() => handleDeleteMaterial(mat.id)} className="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition" title="Hapus">
                                                        <Icon name="trash-2" className="w-4 h-4" />
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {adminSubTab === 'users' && (
                        <div className="glass-card rounded-3xl overflow-hidden">
                            <table className="w-full text-left text-sm text-slate-300">
                                <thead className="bg-slate-900/80 border-b border-slate-800 text-xs text-slate-400 uppercase font-bold">
                                    <tr>
                                        <th className="px-6 py-4">Nama Peserta</th>
                                        <th className="px-6 py-4">Email</th>
                                        <th className="px-6 py-4">Instansi</th>
                                        <th className="px-6 py-4">Role</th>
                                        <th className="px-6 py-4">Status</th>
                                        <th className="px-6 py-4 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {users.map(usr => (
                                        <tr key={usr.id} className="hover:bg-slate-800/40 transition">
                                            <td className="px-6 py-4 font-bold text-white">{usr.full_name}</td>
                                            <td className="px-6 py-4 font-mono text-xs text-slate-400">{usr.email}</td>
                                            <td className="px-6 py-4 text-slate-300">{usr.institution}</td>
                                            <td className="px-6 py-4 capitalize font-semibold text-indigo-400">{usr.role}</td>
                                            <td className="px-6 py-4">
                                                <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${usr.status === 'Aktif' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'}`}>
                                                    {usr.status}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4 text-right">
                                                <button onClick={() => toggleUserStatus(usr.id)} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition border border-slate-700">
                                                    Toggle Status
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {adminSubTab === 'downloads' && (
                        <div className="glass-card rounded-3xl overflow-hidden">
                            <table className="w-full text-left text-sm text-slate-300">
                                <thead className="bg-slate-900/80 border-b border-slate-800 text-xs text-slate-400 uppercase font-bold">
                                    <tr>
                                        <th className="px-6 py-4">Waktu</th>
                                        <th className="px-6 py-4">Peserta</th>
                                        <th className="px-6 py-4">Materi Diunduh</th>
                                        <th className="px-6 py-4">Nama File</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800">
                                    {downloads.map(dl => (
                                        <tr key={dl.id} className="hover:bg-slate-800/40 transition">
                                            <td className="px-6 py-4 font-mono text-xs text-slate-500">{dl.downloaded_at}</td>
                                            <td className="px-6 py-4">
                                                <div className="font-bold text-white">{dl.user_name}</div>
                                                <div className="text-xs text-slate-400">{dl.user_email}</div>
                                            </td>
                                            <td className="px-6 py-4 font-semibold text-slate-200">{dl.material_title}</td>
                                            <td className="px-6 py-4 font-mono text-xs text-slate-400">{dl.file_name}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {adminSubTab === 'rls' && (
                        <div className="glass-card p-8 rounded-3xl space-y-6">
                            <h3 className="text-xl font-bold text-white">Skema Database & Row Level Security (RLS) Supabase</h3>
                            <p className="text-xs text-slate-400">
                                Salin query SQL di bawah ke Supabase SQL Editor untuk membuat tabel dan keamanan data resmi.
                            </p>
                            <pre className="bg-slate-950 text-emerald-300 p-5 rounded-2xl text-xs font-mono border border-slate-800 overflow-x-auto custom-scrollbar">
{`-- 1. TABEL PROFILES
CREATE TABLE public.profiles (
  id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
  full_name TEXT NOT NULL,
  email TEXT UNIQUE NOT NULL,
  institution TEXT NOT NULL,
  whatsapp TEXT,
  avatar_url TEXT,
  role TEXT DEFAULT 'participant',
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. TABEL MATERIALS
CREATE TABLE public.materials (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  title TEXT NOT NULL,
  description TEXT,
  category TEXT NOT NULL,
  presenter TEXT NOT NULL,
  thumbnail_url TEXT,
  file_url TEXT NOT NULL,
  file_name TEXT NOT NULL,
  file_type TEXT NOT NULL,
  file_size TEXT NOT NULL,
  is_active BOOLEAN DEFAULT TRUE,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 3. TABEL DOWNLOAD_HISTORY
CREATE TABLE public.download_history (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  user_id UUID REFERENCES public.profiles(id) ON DELETE CASCADE,
  material_id UUID REFERENCES public.materials(id) ON DELETE CASCADE,
  downloaded_at TIMESTAMPTZ DEFAULT NOW()
);

-- ATURAN RLS (Row Level Security)
ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.materials ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.download_history ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Public materials selectable" ON public.materials FOR SELECT USING (is_active = true);
CREATE POLICY "Users read own profile" ON public.profiles FOR SELECT USING (auth.uid() = id);
CREATE POLICY "Users read own downloads" ON public.download_history FOR SELECT USING (auth.uid() = user_id);`}
                            </pre>
                        </div>
                    )}

                    {showMaterialModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="glass-card rounded-3xl max-w-xl w-full p-8 shadow-2xl relative border border-slate-700">
                                <button onClick={() => setShowMaterialModal(false)} className="absolute top-6 right-6 text-slate-400 hover:text-white">
                                    <Icon name="x" className="w-5 h-5" />
                                </button>
                                <h3 className="text-2xl font-bold text-white mb-6">{editingMaterial ? 'Edit Materi' : 'Tambah Materi Baru'}</h3>
                                
                                <form onSubmit={handleSaveMaterial} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Judul Materi</label>
                                        <input type="text" value={matTitle} onChange={(e) => setMatTitle(e.target.value)} className="w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Link File / URL Materi (Google Drive, Cloud Storage, dll)</label>
                                        <input type="url" value={matFileUrl} onChange={(e) => setMatFileUrl(e.target.value)} placeholder="https://drive.google.com/... atau https://..." className="w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Deskripsi</label>
                                        <textarea value={matDesc} onChange={(e) => setMatDesc(e.target.value)} rows="3" className="w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" required></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Kategori</label>
                                            <input type="text" value={matCat} onChange={(e) => setMatCat(e.target.value)} className="w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Nama Pemateri</label>
                                            <input type="text" value={matPresenter} onChange={(e) => setMatPresenter(e.target.value)} className="w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" required />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Format File</label>
                                            <select value={matFileType} onChange={(e) => setMatFileType(e.target.value)} className="w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                                <option value="PDF">PDF</option>
                                                <option value="PPTX">PPTX</option>
                                                <option value="DOCX">DOCX</option>
                                                <option value="ZIP">ZIP</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Ukuran File</label>
                                            <input type="text" value={matFileSize} onChange={(e) => setMatFileSize(e.target.value)} className="w-full px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none" required />
                                        </div>
                                    </div>

                                    <div className="flex items-center space-x-2 pt-2">
                                        <input type="checkbox" id="matActiveCheck" checked={matActive} onChange={(e) => setMatActive(e.target.checked)} className="rounded bg-slate-900 border-slate-700 text-indigo-500" />
                                        <label htmlFor="matActiveCheck" className="text-xs font-bold text-slate-300">Materi Aktif (Dapat Dilihat Peserta)</label>
                                    </div>

                                    <div className="pt-4 flex justify-end space-x-3">
                                        <button type="button" onClick={() => setShowMaterialModal(false)} className="px-5 py-2.5 border border-slate-800 text-slate-400 rounded-xl text-xs font-bold hover:bg-slate-800 transition">Batal</button>
                                        <button type="submit" className="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
