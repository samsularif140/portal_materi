<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Materi Workshop - Platform Sharing Materi Seminar & Workshop</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React, ReactDOM, Babel, Lucide & Supabase -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // =========================================================================
        // KONFIGURASI SUPABASE
        // =========================================================================
        const SUPABASE_URL = 'https://lrblzcblgbpasujkkfut.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmx6Y2JsZ2JwYXN1amtrZnV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMjg5NDAsImV4cCI6MjEwMzcwNDk0MH0.qW89bzX5JYEQ5r5hoZcr2PbxlhTM-YqbT3R0Q85KUVE';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const DATA_VERSION = "3.4-supabase-cloud";

        const getTypeInfo = (type) => {
            switch(type) {
                case 'pdf':
                    return { icon: 'file-text', color: 'text-rose-400', bg: 'bg-rose-500/10 border-rose-500/20', label: 'PDF Document' };
                case 'presentation':
                case 'ppt':
                    return { icon: 'presentation', color: 'text-amber-400', bg: 'bg-amber-500/10 border-amber-500/20', label: 'Slide PPT' };
                case 'video':
                    return { icon: 'video', color: 'text-sky-400', bg: 'bg-sky-500/10 border-sky-500/20', label: 'Video Sesi' };
                case 'code':
                    return { icon: 'code', color: 'text-emerald-400', bg: 'bg-emerald-500/10 border-emerald-500/20', label: 'Source Code' };
                case 'sheet':
                    return { icon: 'table', color: 'text-teal-400', bg: 'bg-teal-500/10 border-teal-500/20', label: 'Spreadsheet' };
                case 'certificate':
                    return { icon: 'award', color: 'text-purple-400', bg: 'bg-purple-500/10 border-purple-500/20', label: 'E-Sertifikat' };
                default:
                    return { icon: 'link-2', color: 'text-indigo-400', bg: 'bg-indigo-500/10 border-indigo-500/20', label: 'Resource Link' };
            }
        };

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [selectedEventId, setSelectedEventId] = useState(null);

            const [events, setEvents] = useState([]);
            const [materials, setMaterials] = useState([]);

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [selectedType, setSelectedType] = useState('Semua');

            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = useState('');
            const [adminError, setAdminError] = useState('');

            const [showEventModal, setShowEventModal] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            const [eventFormData, setEventFormData] = useState({
                title: '',
                category: 'Umum',
                speaker: '',
                institution: '',
                date: '',
                time: '',
                location: '',
                description: '',
                banner_url: '',
                badge: '',
                is_active: true
            });

            const [showMaterialModal, setShowMaterialModal] = useState(false);
            const [editingMaterial, setEditingMaterial] = useState(null);
            const [materialFormData, setMaterialFormData] = useState({
                event_id: '',
                title: '',
                type: 'pdf',
                speaker: '',
                description: '',
                file_url: '',
                file_size: '5 MB',
                is_active: true,
                is_locked: false
            });

            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => {
                fetchEventsFromSupabase();
                fetchMaterialsFromSupabase();
            }, []);

            const fetchEventsFromSupabase = async () => {
                try {
                    const { data, error } = await supabaseClient
                        .from('events')
                        .select('*')
                        .order('date', { ascending: false });

                    if (error) throw error;
                    if (data) setEvents(data);
                } catch (error) {
                    console.error('Gagal mengambil data events:', error.message);
                }
            };

            const fetchMaterialsFromSupabase = async () => {
                try {
                    const { data, error } = await supabaseClient
                        .from('materials')
                        .select('*');

                    if (error) throw error;
                    if (data) setMaterials(data);
                } catch (error) {
                    console.error('Gagal mengambil data materials:', error.message);
                }
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const selectedEvent = useMemo(() => {
                return events.find(ev => ev.id === selectedEventId) || null;
            }, [events, selectedEventId]);

            const categories = useMemo(() => {
                const cats = new Set(events.map(e => e.category).filter(Boolean));
                return ['Semua', ...Array.from(cats)];
            }, [events]);

            const filteredEvents = useMemo(() => {
                return events.filter(event => {
                    if (!isAdmin && !event.is_active) return false;

                    const matchSearch = (
                        event.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        event.speaker.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (event.description && event.description.toLowerCase().includes(searchQuery.toLowerCase())) ||
                        (event.institution && event.institution.toLowerCase().includes(searchQuery.toLowerCase()))
                    );

                    const matchCategory = selectedCategory === 'Semua' || event.category === selectedCategory;
                    return matchSearch && matchCategory;
                });
            }, [events, searchQuery, selectedCategory, isAdmin]);

            const eventMaterials = useMemo(() => {
                if (!selectedEventId) return [];
                return materials.filter(mat => {
                    if (mat.event_id !== selectedEventId) return false;
                    if (!isAdmin && !mat.is_active) return false;
                    if (selectedType !== 'Semua' && mat.type !== selectedType) return false;
                    return true;
                });
            }, [materials, selectedEventId, isAdmin, selectedType]);

            const handleOpenEvent = (eventId) => {
                setSelectedEventId(eventId);
                setSelectedType('Semua');
                setCurrentView('event-detail');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPasswordInput === 'admin123' || adminPasswordInput === 'admin') {
                    setIsAdmin(true);
                    setShowAdminLoginModal(false);
                    setAdminPasswordInput('');
                    setAdminError('');
                    showToast('Mode Admin aktif!');
                } else {
                    setAdminError('Password salah!');
                }
            };

            const handleSaveEvent = async (e) => {
                e.preventDefault();
                if (!eventFormData.title) {
                    showToast('Judul event wajib diisi', 'error');
                    return;
                }

                try {
                    if (editingEvent) {
                        const { error } = await supabaseClient
                            .from('events')
                            .update({
                                title: eventFormData.title,
                                category: eventFormData.category,
                                badge: eventFormData.badge,
                                speaker: eventFormData.speaker,
                                institution: eventFormData.institution,
                                date: eventFormData.date || null,
                                time: eventFormData.time,
                                location: eventFormData.location,
                                banner_url: eventFormData.banner_url,
                                description: eventFormData.description,
                                is_active: eventFormData.is_active,
                                updated_at: new Date()
                            })
                            .eq('id', editingEvent.id);

                        if (error) throw error;
                        showToast('Event berhasil diperbarui!');
                    } else {
                        const newId = 'ev-' + Date.now();
                        const { error } = await supabaseClient
                            .from('events')
                            .insert([{
                                id: newId,
                                title: eventFormData.title,
                                category: eventFormData.category,
                                badge: eventFormData.badge,
                                speaker: eventFormData.speaker,
                                institution: eventFormData.institution,
                                date: eventFormData.date || null,
                                time: eventFormData.time,
                                location: eventFormData.location,
                                banner_url: eventFormData.banner_url,
                                description: eventFormData.description,
                                is_active: eventFormData.is_active
                            }]);

                        if (error) throw error;
                        showToast('Event baru berhasil ditambahkan!');
                    }

                    fetchEventsFromSupabase();
                    setShowEventModal(false);
                    setEditingEvent(null);
                } catch (error) {
                    showToast('Gagal simpan event: ' + error.message, 'error');
                }
            };

            // SIMPAN MATERI KE SUPABASE DENGAN AMAN
            const handleSaveMaterial = async (e) => {
                e.preventDefault();
                if (!materialFormData.title || !materialFormData.file_url) {
                    showToast('Judul dan URL file materi wajib diisi', 'error');
                    return;
                }

                try {
                    const payload = {
                        event_id: materialFormData.event_id,
                        title: materialFormData.title,
                        type: materialFormData.type,
                        speaker: materialFormData.speaker || '',
                        description: materialFormData.description || '',
                        file_url: materialFormData.file_url,
                        file_size: materialFormData.file_size || '5 MB',
                        is_active: materialFormData.is_active,
                        is_locked: materialFormData.is_locked || false
                    };

                    if (editingMaterial) {
                        const { error } = await supabaseClient
                            .from('materials')
                            .update(payload)
                            .eq('id', editingMaterial.id);

                        if (error) throw error;
                        showToast('Materi berhasil diperbarui di Supabase!');
                    } else {
                        const newMatId = 'mat-' + Date.now();
                        payload.id = newMatId;
                        payload.download_count = 0;

                        const { error } = await supabaseClient
                            .from('materials')
                            .insert([payload]);

                        if (error) throw error;
                        showToast('Materi baru berhasil disimpan ke Supabase!');
                    }

                    fetchMaterialsFromSupabase();
                    setShowMaterialModal(false);
                    setEditingMaterial(null);
                } catch (error) {
                    console.error('Error simpan materi:', error);
                    showToast('Gagal simpan materi: ' + (error.message || error.details || 'Kesalahan database'), 'error');
                }
            };

            const handleDeleteEvent = async (eventId) => {
                if (confirm('Hapus event ini beserta seluruh materinya?')) {
                    try {
                        await supabaseClient.from('events').delete().eq('id', eventId);
                        await supabaseClient.from('materials').delete().eq('event_id', eventId);
                        if (selectedEventId === eventId) setCurrentView('home');
                        fetchEventsFromSupabase();
                        fetchMaterialsFromSupabase();
                        showToast('Event berhasil dihapus.');
                    } catch (error) {
                        showToast('Gagal menghapus event: ' + error.message, 'error');
                    }
                }
            };

            const handleDeleteMaterial = async (materialId) => {
                if (confirm('Hapus materi ini?')) {
                    try {
                        const { error } = await supabaseClient.from('materials').delete().eq('id', materialId);
                        if (error) throw error;
                        fetchMaterialsFromSupabase();
                        showToast('Materi berhasil dihapus');
                    } catch (error) {
                        showToast('Gagal menghapus materi: ' + error.message, 'error');
                    }
                }
            };

            const handleDownloadClick = async (material) => {
                try {
                    const newCount = (material.download_count || 0) + 1;
                    await supabaseClient.from('materials').update({ download_count: newCount }).eq('id', material.id);
                    fetchMaterialsFromSupabase();
                } catch (e) {
                    console.error(e);
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-[#0b0f19] text-slate-100">
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 flex items-center space-x-3 bg-slate-800/95 border border-slate-700 text-white px-5 py-3.5 rounded-2xl shadow-2xl backdrop-blur-md animate-bounce">
                            <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className={toast.type === 'error' ? 'w-5 h-5 text-rose-400' : 'w-5 h-5 text-emerald-400'}></i>
                            <span className="text-sm font-medium">{toast.message}</span>
                        </div>
                    )}

                    <header className="sticky top-0 z-40 bg-[#0b0f19]/80 backdrop-blur-xl border-b border-slate-800/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div onClick={() => { setCurrentView('home'); setSelectedEventId(null); }} className="flex items-center space-x-3 cursor-pointer group">
                                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 p-[2px] shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition duration-300">
                                    <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                                        <i data-lucide="layers" className="w-5 h-5 text-indigo-400"></i>
                                    </div>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <span className="font-extrabold text-lg tracking-tight text-white group-hover:text-indigo-400 transition">Portal Materi</span>
                                        <span className="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Workshop</span>
                                    </div>
                                    <p className="text-xs text-slate-400 font-medium hidden sm:block">Akses Modul, Slide & Rekaman Resmi</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-3">
                                {currentView !== 'home' && (
                                    <button onClick={() => { setCurrentView('home'); setSelectedEventId(null); }} className="hidden sm:flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition border border-transparent hover:border-slate-700">
                                        <i data-lucide="arrow-left" className="w-4 h-4"></i>
                                        <span>Daftar Event</span>
                                    </button>
                                )}

                                {isAdmin ? (
                                    <div className="flex items-center space-x-2 bg-indigo-950/40 border border-indigo-500/30 px-3 py-1.5 rounded-2xl">
                                        <span className="flex h-2 w-2 relative">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </span>
                                        <span className="text-xs font-bold text-indigo-300 hidden md:inline">Mode Admin</span>
                                        <button onClick={() => { setIsAdmin(false); showToast('Keluar dari mode admin'); }} className="p-1 text-slate-400 hover:text-rose-400 transition" title="Keluar Admin">
                                            <i data-lucide="log-out" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button onClick={() => setShowAdminLoginModal(true)} className="flex items-center space-x-2 px-3.5 py-2 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-semibold transition shadow-sm">
                                        <i data-lucide="lock" className="w-3.5 h-3.5 text-indigo-400"></i>
                                        <span>Kelola Data</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {currentView === 'home' && (
                            <div>
                                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-950/70 via-slate-900 to-slate-950 border border-indigo-900/30 p-8 sm:p-12 mb-10 shadow-2xl">
                                    <div className="relative z-10 max-w-3xl">
                                        <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-semibold mb-6">
                                            <i data-lucide="sparkles" className="w-4 h-4 text-indigo-400"></i>
                                            <span>Database Terhubung ke Supabase</span>
                                        </div>
                                        <h1 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight mb-4">
                                            Akses & Unduh Materi <br className="hidden sm:inline" />
                                            <span className="bg-gradient-to-r from-indigo-400 via-sky-300 to-indigo-200 bg-clip-text text-transparent">Workshop, Seminar, & Pelatihan</span>
                                        </h1>
                                        <p className="text-base sm:text-lg text-slate-300 leading-relaxed mb-8">
                                            Dapatkan slide presentasi resmi, template desain, source code praktikum, modul PDF, dan rekaman workshop dalam satu tempat.
                                        </p>

                                        <div className="relative max-w-2xl">
                                            <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                                            <input 
                                                type="text"
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                placeholder="Cari judul workshop, pemateri, atau topik pelatihan..."
                                                className="w-full pl-12 pr-28 py-4 bg-slate-900/90 border border-slate-700/80 rounded-2xl text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-inner"
                                            />
                                            {searchQuery && (
                                                <button onClick={() => setSearchQuery('')} className="absolute right-14 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs font-semibold">Reset</button>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                                    <div className="flex items-center space-x-2 overflow-x-auto pb-2 sm:pb-0 scrollbar-none">
                                        {categories.map((cat) => (
                                            <button
                                                key={cat}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                                                    selectedCategory === cat ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' : 'bg-slate-900/80 text-slate-400 hover:text-slate-200 hover:bg-slate-800 border border-slate-800'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>

                                    {isAdmin && (
                                        <button
                                            onClick={() => {
                                                setEditingEvent(null);
                                                setEventFormData({
                                                    title: '',
                                                    category: 'Umum',
                                                    speaker: '',
                                                    institution: '',
                                                    date: new Date().toISOString().split('T')[0],
                                                    time: '09:00 - 12:00 WIB',
                                                    location: 'Online',
                                                    description: '',
                                                    banner_url: '',
                                                    badge: 'Baru',
                                                    is_active: true
                                                });
                                                setShowEventModal(true);
                                            }}
                                            className="inline-flex items-center space-x-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-600/20 whitespace-nowrap"
                                        >
                                            <i data-lucide="plus-circle" className="w-4 h-4"></i>
                                            <span>Tambah Event Baru</span>
                                        </button>
                                    )}
                                </div>

                                {filteredEvents.length === 0 ? (
                                    <div className="text-center py-20 bg-slate-900/40 border border-slate-800/80 rounded-3xl p-8">
                                        <h3 className="text-lg font-bold text-white mb-1">Event Tidak Ditemukan</h3>
                                        <p className="text-sm text-slate-400 max-w-md mx-auto mb-6">Tidak ada event yang sesuai.</p>
                                        <button onClick={() => { setSearchQuery(''); setSelectedCategory('Semua'); }} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition">Tampilkan Semua Event</button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {filteredEvents.map((event) => {
                                            return (
                                                <div key={event.id} className="group bg-slate-900/70 hover:bg-slate-900 border border-slate-800/80 hover:border-indigo-500/40 rounded-3xl overflow-hidden transition duration-300 flex flex-col shadow-xl">
                                                    <div className="relative h-48 w-full overflow-hidden bg-slate-950">
                                                        <img src={event.banner_url || "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=800&q=80"} alt={event.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500"/>
                                                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                                                        <div className="absolute top-4 left-4 flex flex-wrap gap-2">
                                                            <span className="px-3 py-1 rounded-full text-[11px] font-bold bg-indigo-600/90 text-white backdrop-blur-md">{event.category}</span>
                                                        </div>
                                                        {isAdmin && (
                                                            <div className="absolute top-4 right-4">
                                                                <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${event.is_active ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>{event.is_active ? 'Publik' : 'Draft'}</span>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="p-6 flex-1 flex flex-col justify-between">
                                                        <div>
                                                            <h3 className="text-lg font-bold text-white mb-2 line-clamp-2 group-hover:text-indigo-300 transition">{event.title}</h3>
                                                            <div className="flex items-center space-x-2 text-xs text-indigo-400 font-semibold mb-3">
                                                                <i data-lucide="user" className="w-3.5 h-3.5"></i>
                                                                <span className="truncate">{event.speaker}</span>
                                                            </div>
                                                            <p className="text-xs text-slate-400 line-clamp-3 leading-relaxed mb-4">{event.description}</p>
                                                        </div>

                                                        <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between gap-2">
                                                            <button onClick={() => handleOpenEvent(event.id)} className="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2">
                                                                <span>Buka Materi</span>
                                                                <i data-lucide="arrow-right" className="w-4 h-4"></i>
                                                            </button>

                                                            {isAdmin && (
                                                                <div className="flex items-center space-x-1">
                                                                    <button onClick={() => { setEditingEvent(event); setEventFormData({ ...event }); setShowEventModal(true); }} className="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl" title="Edit">
                                                                        <i data-lucide="edit-3" className="w-4 h-4"></i>
                                                                    </button>
                                                                    <button onClick={() => handleDeleteEvent(event.id)} className="p-2.5 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-xl" title="Hapus">
                                                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                    </button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {currentView === 'event-detail' && selectedEvent && (
                            <div>
                                <div className="flex items-center justify-between mb-6">
                                    <button onClick={() => setCurrentView('home')} className="inline-flex items-center space-x-2 text-xs font-bold text-slate-400 hover:text-white transition group bg-slate-900/60 px-3.5 py-2 rounded-xl border border-slate-800">
                                        <i data-lucide="arrow-left" className="w-4 h-4"></i>
                                        <span>Kembali ke Beranda</span>
                                    </button>
                                </div>

                                <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 mb-8 shadow-2xl">
                                    <h1 className="text-2xl sm:text-4xl font-extrabold text-white tracking-tight mb-4">{selectedEvent.title}</h1>
                                    <p className="text-slate-300 text-sm leading-relaxed mb-6">{selectedEvent.description}</p>
                                </div>

                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-white">Berkas & Materi Workshop</h2>
                                    {isAdmin && (
                                        <button
                                            onClick={() => {
                                                setEditingMaterial(null);
                                                setMaterialFormData({
                                                    event_id: selectedEvent.id,
                                                    title: '',
                                                    type: 'pdf',
                                                    speaker: selectedEvent.speaker,
                                                    description: '',
                                                    file_url: '',
                                                    file_size: '5 MB',
                                                    is_active: true,
                                                    is_locked: false
                                                });
                                                setShowMaterialModal(true);
                                            }}
                                            className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold"
                                        >
                                            Tambah Materi
                                        </button>
                                    )}
                                </div>

                                {eventMaterials.length === 0 ? (
                                    <div className="text-center py-12 bg-slate-900/40 border border-slate-800 rounded-2xl">
                                        <p className="text-sm text-slate-400">Belum ada materi untuk event ini.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {eventMaterials.map((mat) => {
                                            const typeInfo = getTypeInfo(mat.type);
                                            return (
                                                <div key={mat.id} className="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                                                    <div>
                                                        <div className="flex justify-between items-start mb-3">
                                                            <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-md border ${typeInfo.bg} ${typeInfo.color}`}>{typeInfo.label}</span>
                                                            {isAdmin && (
                                                                <button onClick={() => handleDeleteMaterial(mat.id)} className="text-rose-400 hover:text-rose-300">
                                                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                                </button>
                                                            )}
                                                        </div>
                                                        <h3 className="text-sm font-bold text-white mb-1.5">{mat.title}</h3>
                                                        <p className="text-xs text-slate-400 mb-4">{mat.description}</p>
                                                    </div>
                                                    <div className="pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                                                        <span className="text-slate-400">{mat.download_count || 0} unduhan</span>
                                                        <a href={mat.file_url} target="_blank" rel="noopener noreferrer" onClick={() => handleDownloadClick(mat)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold flex items-center space-x-1.5">
                                                            <span>Unduh / Buka</span>
                                                            <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                                        </a>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {showAdminLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl relative">
                                <h3 className="text-lg font-bold text-white text-center mb-1">Akses Pengelola Data</h3>
                                <p className="text-xs text-slate-400 text-center mb-6">Masukkan password admin untuk mengelola event.</p>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div className="relative">
                                        <input type="password" value={adminPasswordInput} onChange={(e) => { setAdminPasswordInput(e.target.value); setAdminError(''); }} placeholder="Masukkan password admin..." className="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white outline-none focus:ring-2 focus:ring-indigo-500" autoFocus/>
                                    </div>
                                    {adminError && <p className="text-xs text-rose-400">{adminError}</p>}
                                    <div className="flex justify-end space-x-3 pt-2">
                                        <button type="button" onClick={() => { setShowAdminLoginModal(false); setAdminError(''); setAdminPasswordInput(''); }} className="px-4 py-2 text-xs text-slate-400 hover:text-white">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition">Masuk</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showEventModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-xl w-full my-8">
                                <h3 className="text-lg font-bold text-white mb-4">{editingEvent ? 'Edit Event' : 'Tambah Event Baru'}</h3>
                                <form onSubmit={handleSaveEvent} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1">Judul Event *</label>
                                        <input type="text" required value={eventFormData.title} onChange={e => setEventFormData({...eventFormData, title: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"/>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1">Kategori</label>
                                            <input type="text" value={eventFormData.category} onChange={e => setEventFormData({...eventFormData, category: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"/>
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1">Pemateri</label>
                                            <input type="text" value={eventFormData.speaker} onChange={e => setEventFormData({...eventFormData, speaker: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1">Banner URL</label>
                                        <input type="url" value={eventFormData.banner_url} onChange={e => setEventFormData({...eventFormData, banner_url: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"/>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1">Deskripsi</label>
                                        <textarea rows="3" value={eventFormData.description} onChange={e => setEventFormData({...eventFormData, description: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"></textarea>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <input type="checkbox" id="activeChk" checked={eventFormData.is_active} onChange={e => setEventFormData({...eventFormData, is_active: e.target.checked})}/>
                                        <label htmlFor="activeChk" className="text-slate-300">Publikasikan Event</label>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                                        <button type="button" onClick={() => setShowEventModal(false)} className="px-4 py-2 text-slate-400">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 text-white font-bold rounded-xl">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showMaterialModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-lg w-full">
                                <h3 className="text-lg font-bold text-white mb-4">Tambah Materi Baru</h3>
                                <form onSubmit={handleSaveMaterial} className="space-y-4 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1">Judul Materi *</label>
                                        <input type="text" required placeholder="Contoh: Slide Modul Pembelajaran" value={materialFormData.title} onChange={e => setMaterialFormData({...materialFormData, title: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"/>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1">Tipe File</label>
                                            <select value={materialFormData.type} onChange={e => setMaterialFormData({...materialFormData, type: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white">
                                                <option value="pdf">PDF Document</option>
                                                <option value="presentation">Slide PPT</option>
                                                <option value="video">Video Sesi</option>
                                                <option value="code">Source Code</option>
                                                <option value="sheet">Spreadsheet</option>
                                                <option value="certificate">E-Sertifikat</option>
                                                <option value="link">Resource Link</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-300 mb-1">Ukuran / Keterangan</label>
                                            <input type="text" placeholder="Contoh: 5 MB" value={materialFormData.file_size} onChange={e => setMaterialFormData({...materialFormData, file_size: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1">URL File / Tautan *</label>
                                        <input type="url" required placeholder="https://..." value={materialFormData.file_url} onChange={e => setMaterialFormData({...materialFormData, file_url: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"/>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-300 mb-1">Deskripsi Singkat</label>
                                        <textarea rows="2" value={materialFormData.description} onChange={e => setMaterialFormData({...materialFormData, description: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white"></textarea>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <input type="checkbox" id="matActive" checked={materialFormData.is_active} onChange={e => setMaterialFormData({...materialFormData, is_active: e.target.checked})}/>
                                        <label htmlFor="matActive" className="text-slate-300">Publikasikan Materi</label>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                                        <button type="button" onClick={() => setShowMaterialModal(false)} className="px-4 py-2 text-slate-400">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 text-white font-bold rounded-xl">Simpan Materi</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
